<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mahila Mitra</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f5e7d5;font-family:Arial,sans-serif}
#scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 27%,#fff 0%,#fbf0e2 47%,transparent 76%),linear-gradient(#f8ecdd 0 70%,#ead1b2 70% 100%)}
#scene:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-18%;height:31%;background:#e7c9a8;border-radius:50% 50% 0 0/22% 22% 0 0;z-index:0}
img{user-select:none;-webkit-user-drag:none}
#cat{position:absolute;z-index:4;width:min(32vw,430px);right:7%;bottom:5%;filter:drop-shadow(0 18px 15px rgba(75,48,28,.18));transform-origin:bottom center}
#cat.happy{animation:happy 1.25s cubic-bezier(.22,.8,.3,1) 2}
/* handsome standalone pigeon — no background, no bouquet */
#pigeon{position:absolute;z-index:9;width:clamp(175px,21vw,270px);height:auto;left:-18vw;top:7%;opacity:0;overflow:visible;filter:drop-shadow(0 10px 8px rgba(60,45,35,.18));transform-origin:50% 85%}
#pigeon.fly{animation:flyToHead 4.2s cubic-bezier(.16,1,.3,1) forwards}
/* New elegant bouquet — also standalone */
#bouquet{position:absolute;z-index:11;width:clamp(150px,19vw,245px);height:auto;left:58%;top:24%;opacity:0;pointer-events:none;filter:drop-shadow(0 12px 9px rgba(80,45,30,.16));transform-origin:center center}
#bouquet.show{animation:bouquetAppear .45s cubic-bezier(.2,.9,.2,1) forwards}
#bouquet.receive{animation:handOff 2.05s cubic-bezier(.16,1,.3,1) forwards}
#gift{position:absolute;z-index:20;width:min(25vw,350px);left:50%;top:55%;transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(0 20px 18px rgba(80,52,30,.2));transition:transform .25s ease,opacity .55s ease}
#gift:hover{transform:translate(-50%,-50%) scale(1.045)}#gift.opened{opacity:0;transform:translate(-50%,-50%) scale(1.18);pointer-events:none}
#hint{position:absolute;z-index:21;left:50%;top:75%;transform:translateX(-50%);font-size:14px;color:#9a6b52;opacity:.7;transition:.4s}.hide{opacity:0!important}
.petal{position:absolute;z-index:3;width:13px;height:8px;background:#f5a4b8;border-radius:100% 0 100% 0;opacity:0}.petals-on .petal{animation:petalFall 7.6s cubic-bezier(.2,.65,.3,1) forwards}
.petal:nth-child(1){left:4%;top:-8%;animation-delay:.0s}.petal:nth-child(2){left:9%;top:-15%;animation-delay:.25s}.petal:nth-child(3){left:14%;top:-5%;animation-delay:.5s}.petal:nth-child(4){left:19%;top:-18%;animation-delay:.8s}.petal:nth-child(5){left:25%;top:-10%;animation-delay:1.1s}.petal:nth-child(6){left:31%;top:-20%;animation-delay:1.35s}.petal:nth-child(7){left:37%;top:-7%;animation-delay:1.6s}.petal:nth-child(8){left:43%;top:-16%;animation-delay:1.9s}.petal:nth-child(9){left:49%;top:-4%;animation-delay:2.2s}.petal:nth-child(10){left:55%;top:-19%;animation-delay:2.45s}.petal:nth-child(11){left:61%;top:-9%;animation-delay:2.7s}.petal:nth-child(12){left:67%;top:-17%;animation-delay:3s}.petal:nth-child(13){left:73%;top:-6%;animation-delay:3.2s}.petal:nth-child(14){left:79%;top:-20%;animation-delay:3.45s}.petal:nth-child(15){left:85%;top:-8%;animation-delay:3.7s}.petal:nth-child(16){left:91%;top:-15%;animation-delay:4s}.petal:nth-child(17){left:7%;top:-25%;animation-delay:4.2s}.petal:nth-child(18){left:23%;top:-28%;animation-delay:4.45s}.petal:nth-child(19){left:40%;top:-24%;animation-delay:4.7s}.petal:nth-child(20){left:58%;top:-27%;animation-delay:5s}.petal:nth-child(21){left:75%;top:-23%;animation-delay:5.25s}.petal:nth-child(22){left:94%;top:-30%;animation-delay:5.5s}.petal:nth-child(23){left:33%;top:-32%;animation-delay:5.8s}.petal:nth-child(24){left:68%;top:-34%;animation-delay:6.1s}
.petal:nth-child(3n){width:17px;height:10px}.petal:nth-child(4n){width:10px;height:14px;background:#fff0e8}.petal:nth-child(5n){background:#f7c2cf}

.p1{left:8%;top:-6%;animation-delay:0s}.p2{left:22%;top:-10%;animation-delay:.45s}.p3{left:40%;top:-5%;animation-delay:.9s}.p4{left:58%;top:-12%;animation-delay:.2s}.p5{left:75%;top:-7%;animation-delay:1.1s}.p6{left:90%;top:-15%;animation-delay:1.5s}.p7{left:31%;top:-18%;animation-delay:.7s}.p8{left:68%;top:-8%;animation-delay:1.3s}
.p9{left:3%;top:-22%;animation-delay:1.8s}.p10{left:12%;top:-30%;animation-delay:2.1s}.p11{left:27%;top:-24%;animation-delay:2.5s}.p12{left:36%;top:-34%;animation-delay:2.9s}.p13{left:47%;top:-26%;animation-delay:3.3s}.p14{left:56%;top:-36%;animation-delay:3.7s}.p15{left:64%;top:-25%;animation-delay:4.1s}.p16{left:73%;top:-33%;animation-delay:4.5s}.p17{left:82%;top:-28%;animation-delay:4.9s}.p18{left:96%;top:-38%;animation-delay:5.3s}.p19{left:18%;top:-42%;animation-delay:5.7s}.p20{left:44%;top:-45%;animation-delay:6.1s}.p21{left:69%;top:-43%;animation-delay:6.5s}.p22{left:88%;top:-47%;animation-delay:6.9s}
/* Ends with pigeon feet directly over the cat's hat/head */
@keyframes flyToHead{
  0%{left:-18vw;top:7%;opacity:0;transform:rotate(-8deg) scale(.58)}
  8%{opacity:1}
  24%{left:12%;top:10%;transform:rotate(5deg) scale(.72)}
  43%{left:30%;top:18%;transform:rotate(-4deg) scale(.78)}
  62%{left:49%;top:12%;transform:rotate(3deg) scale(.82)}
  79%{left:62%;top:19%;transform:rotate(-3deg) scale(.80)}
  91%{left:68%;top:22%;transform:rotate(1deg) scale(.78)}
  100%{left:70%;top:25%;opacity:1;transform:rotate(0deg) scale(.76)}
}
@keyframes bouquetAppear{
  0%{opacity:0;transform:translate(-10px,-20px) scale(.28) rotate(-7deg)}
  100%{opacity:1;transform:translate(0,0) scale(.74) rotate(-2deg)}
}
@keyframes handOff{
  0%{left:58%;top:24%;opacity:1;transform:rotate(-8deg) scale(.38)}
  22%{left:62%;top:36%;transform:rotate(-5deg) scale(.52)}
  50%{left:67%;top:49%;transform:rotate(2deg) scale(.56)}
  78%{left:70%;top:58%;transform:rotate(1deg) scale(.56)}
  100%{left:71%;top:66%;opacity:1;transform:rotate(0deg) scale(.46)}
}
@keyframes happy{
  0%,100%{transform:translateY(0) rotate(0) scale(1)}
  18%{transform:translateY(-10px) rotate(-2deg) scale(1.012)}
  36%{transform:translateY(0) rotate(2deg) scale(1)}
  55%{transform:translateY(-7px) rotate(-1.5deg) scale(1.008)}
  72%{transform:translateY(0) rotate(1.5deg) scale(1)}
  88%{transform:translateY(-4px) rotate(-.7deg) scale(1.004)}
}
@keyframes petalFall{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:.85}100%{opacity:0;transform:translate(140px,105vh) rotate(420deg)}}
@media(max-width:700px){#cat{width:48vw;right:3%;bottom:7%}#pigeon{width:42vw}#bouquet{width:27vw}#gift{width:40vw}}
</style>
</head>
<body>
<div id="scene">
<div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="petal p7"></div><div class="petal p8"></div><div class="petal p9"></div><div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div><div class="petal p13"></div><div class="petal p14"></div><div class="petal p15"></div><div class="petal p16"></div><div class="petal p17"></div><div class="petal p18"></div><div class="petal p19"></div><div class="petal p20"></div><div class="petal p21"></div><div class="petal p22"></div><div class="petal p23"></div><div class="petal p24"></div>
<img id="cat" src="cat.png" alt="">

<!-- Polished cartoon/3D-style pigeon. It is completely separate from the flowers. -->
<img id="pigeon" src="pigeon.svg" alt="handsome 3D pigeon">

<!-- Bouquet appears ONLY after the pigeon has landed, then transfers to cat. -->
<img id="bouquet" src="bouquet.svg" alt="beautiful flower bouquet">

<img id="gift" src="gift.png" alt="Gift box" tabindex="0">
<div id="hint">click the gift</div>
</div>
<script>
const gift=document.getElementById('gift'),pigeon=document.getElementById('pigeon'),bouquet=document.getElementById('bouquet'),cat=document.getElementById('cat'),hint=document.getElementById('hint');
function start(){if(document.body.classList.contains('started'))return;document.body.classList.add('started');gift.classList.add('opened');hint.classList.add('hide');setTimeout(()=>pigeon.classList.add('fly'),180);setTimeout(()=>bouquet.classList.add('show'),4050);setTimeout(()=>bouquet.classList.add('receive'),4250);setTimeout(()=>{cat.classList.add('happy');document.body.classList.add('petals-on')},6100)}
gift.onclick=start;gift.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}};
</script>
</body>
</html>
